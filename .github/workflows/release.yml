name: Release Windows app
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title "EPDF $env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $artifacts = Get-ChildItem dist/*Setup.exe,dist/*Portable.exe,dist/*.blockmap,dist/latest.yml | Select-Object -ExpandProperty FullName
          gh release upload $env:GITHUB_REF_NAME @artifacts --clobber
